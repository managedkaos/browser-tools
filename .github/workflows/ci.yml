name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Swift (Xcode)
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: make test

      - name: Check shell completions
        run: make check-completions
